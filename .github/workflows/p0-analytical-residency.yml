name: p0-analytical-residency

on:
  push:
    branches:
      - one/mosaic-p0-analytical-residency-v1-20260918
    paths:
      - "runtime/**"
      - "tests/**"
      - "experiments/MOSAIC_P0A_ANALYTICAL_RESIDENCY_V1.md"
      - ".github/workflows/p0-analytical-residency.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "tests/**"
      - "experiments/MOSAIC_P0A_ANALYTICAL_RESIDENCY_V1.md"
      - ".github/workflows/p0-analytical-residency.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q runtime tests
