name: p1-protocol-harness

on:
  push:
    branches:
      - one/mosaic-p1-protocol-harness-v1-20260918
    paths:
      - "runtime/handoff.py"
      - "tests/p1_cases.py"
      - "tests/test_p1_handoff.py"
      - "experiments/MOSAIC_P1A_PROTOCOL_HARNESS_V1.md"
      - ".github/workflows/p1-protocol-harness.yml"
  pull_request:
    paths:
      - "runtime/handoff.py"
      - "tests/p1_cases.py"
      - "tests/test_p1_handoff.py"
      - "experiments/MOSAIC_P1A_PROTOCOL_HARNESS_V1.md"
      - ".github/workflows/p1-protocol-harness.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q runtime tests
